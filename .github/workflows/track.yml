name: Atualizar pista de contribuições

on:
  schedule:
    - cron: "17 6 * * *" # todo dia
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/track.py, .github/workflows/track.yml]

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/track.py ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/track.svg assets/contributions.json
          git diff --cached --quiet || (git commit -m "Atualiza pista de contribuições" && git push)
