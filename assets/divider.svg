<svg xmlns="http://www.w3.org/2000/svg" width="960" height="16" viewBox="0 0 960 16" role="img" aria-label="Divisória"><title>Divisória</title><defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3a3a3d"/><stop offset=".35" stop-color="#1e1e20"/><stop offset="1" stop-color="#0c0c0d"/>
</linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2b3038"/><stop offset=".55" stop-color="#0d0f12"/><stop offset="1" stop-color="#1a1d22"/>
</linearGradient>
<radialGradient id="rim" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#3b3b3e"/><stop offset=".8" stop-color="#1c1c1e"/><stop offset="1" stop-color="#2e2e30"/>
</radialGradient>
<radialGradient id="glowR" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#e10600" stop-opacity=".85"/><stop offset="1" stop-color="#e10600" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowW" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="streak"><stop offset="0" stop-color="#e10600" stop-opacity="0"/><stop offset="1" stop-color="#e10600"/></linearGradient></defs>
<rect width="960" height="16" fill="none"/>
<rect x="0" y="7" width="960" height="2" fill="#1f1f22"/>
<rect x="-160" y="6" width="160" height="4" rx="2" fill="url(#streak)">
  <animate attributeName="x" from="-160" to="960" dur="3.2s" repeatCount="indefinite"/></rect></svg>
