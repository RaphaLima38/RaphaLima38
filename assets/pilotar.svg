<svg xmlns="http://www.w3.org/2000/svg" width="560" height="116" viewBox="0 0 560 116" role="img" aria-label="PILOTAR: jogue no circuito de contribuições">
<title>PILOTAR</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211a12"/><stop offset="1" stop-color="#0d0b09"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd58f"/><stop offset="1" stop-color="#f5a524"/></linearGradient>
  <linearGradient id="sweep"><stop offset="0" stop-color="#ffc46b" stop-opacity="0"/><stop offset=".5" stop-color="#ffe2a8" stop-opacity=".35"/><stop offset="1" stop-color="#ffc46b" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <clipPath id="clip"><rect x="8" y="8" width="544" height="100" rx="20"/></clipPath>
</defs>
<rect x="8" y="8" width="544" height="100" rx="20" fill="none" stroke="#f5a524" stroke-width="6" filter="url(#glow)" opacity=".55">
  <animate attributeName="opacity" values=".25;.75;.25" dur="1.8s" repeatCount="indefinite"/></rect>
<rect x="8" y="8" width="544" height="100" rx="20" fill="url(#bg)" stroke="#f5a524" stroke-width="2"/>
<g clip-path="url(#clip)">
  <rect x="-160" y="8" width="140" height="100" fill="url(#sweep)" transform="skewX(-20)">
    <animate attributeName="x" values="-160;-160;720" keyTimes="0;.45;1" dur="2.6s" repeatCount="indefinite"/></rect>
  <g opacity=".9">
    <rect x="34" y="34" width="12" height="12" fill="#e8e4dc"/><rect x="46" y="34" width="12" height="12" fill="#14110e"/><rect x="58" y="34" width="12" height="12" fill="#e8e4dc"/>
    <rect x="34" y="46" width="12" height="12" fill="#14110e"/><rect x="46" y="46" width="12" height="12" fill="#e8e4dc"/><rect x="58" y="46" width="12" height="12" fill="#14110e"/>
    <rect x="34" y="58" width="12" height="12" fill="#e8e4dc"/><rect x="46" y="58" width="12" height="12" fill="#14110e"/><rect x="58" y="58" width="12" height="12" fill="#e8e4dc"/>
    <rect x="31" y="31" width="42" height="42" fill="none" stroke="#3a3229" stroke-width="2" rx="3"/>
    <rect x="31" y="73" width="3" height="16" fill="#9c9387"/>
  </g>
  <text x="92" y="68" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-style="italic" font-weight="900" font-size="46" letter-spacing="4" fill="url(#txt)">PILOTAR</text>
  <text x="94" y="91" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5" letter-spacing="1.5" fill="#9c9387">JOGUE NO CIRCUITO · 1 OU 2 JOGADORES</text>
  <rect x="94" y="75" width="64" height="2.5" fill="#e3170a"/>
  <g font-family="'Inter','Segoe UI',Arial,sans-serif" font-weight="900" font-style="italic" font-size="40" fill="#f5a524">
    <text x="440" y="72" opacity=".2">›<animate attributeName="opacity" values=".15;1;.15" dur="1.1s" begin="0s" repeatCount="indefinite"/></text>
    <text x="468" y="72" opacity=".2">›<animate attributeName="opacity" values=".15;1;.15" dur="1.1s" begin=".18s" repeatCount="indefinite"/></text>
    <text x="496" y="72" opacity=".2">›<animate attributeName="opacity" values=".15;1;.15" dur="1.1s" begin=".36s" repeatCount="indefinite"/></text>
  </g>
</g>
</svg>
